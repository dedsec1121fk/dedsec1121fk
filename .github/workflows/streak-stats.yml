name: Profile Data Refresh Engine

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

# All profile writers share one lock. This prevents a manual refresh, daily
# refresh and color rotation from writing the same files at the same time.
concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch GitHub data once and render local cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_profile_cards.py fetch-render

      - name: Load current shared palette
        id: theme
        run: python3 .github/scripts/rotate_card_theme.py emit

      - name: Refresh cached profile-view total
        run: python3 .github/scripts/sync_profile_views.py refresh

      # The snake is the only remaining third-party GitHub-data generator and
      # runs once daily instead of being regenerated every four hours.
      - name: Generate contribution snake once
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ steps.theme.outputs.snake_outputs }}

      - name: Publish refreshed snake
        if: steps.snake.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "Refresh ${{ steps.theme.outputs.theme }} contribution snake"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      - name: Verify local cards
        run: |
          python3 .github/scripts/sync_profile_views.py verify
          python3 .github/scripts/rotate_card_theme.py verify

      - name: Commit refreshed local profile data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/profile-data.json profile/profile-views.json profile/views.svg profile/stats.svg profile/streak.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Profile data is already current."
          else
            git commit -m "Refresh cached GitHub profile data"

            # A manual/user push can land after checkout. Rebase and retry instead
            # of failing the whole refresh with a non-fast-forward rejection.
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi

              echo "Main branch moved during refresh; synchronizing before retry ${attempt}/3."
              git fetch origin "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
              git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            done

            echo "Unable to publish refreshed profile data after 3 retries." >&2
            exit 1
          fi
