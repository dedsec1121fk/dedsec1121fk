name: Update GitHub Streak Card

on:
  schedule:
    # Refresh the static card every day using Greece local time.
    - cron: "27 5 * * *"
      timezone: "Europe/Athens"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/streak-stats.yml"
      - ".github/scripts/rotate_card_theme.py"
      - ".github/profile-themes.json"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-streak-card
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Load the current shared palette
        id: theme
        run: python3 .github/scripts/rotate_card_theme.py emit

      - name: Generate the static streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: ${{ steps.theme.outputs.streak_options }}
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "Streak card is already current."
          else
            git commit -m "Refresh GitHub streak card"
            git push
          fi
