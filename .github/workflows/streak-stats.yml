name: Update GitHub Streak Card

on:
  schedule:
    - cron: "27 5 * * *"
      timezone: "Europe/Athens"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/streak-stats.yml"
      - ".github/scripts/rotate_card_theme.py"
      - ".github/profile-themes.json"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Load current profile palette
        id: theme
        run: python3 .github/scripts/rotate_card_theme.py emit

      - name: Prepare output directory
        run: mkdir -p profile

      - name: Generate real streak statistics
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: ${{ steps.theme.outputs.streak_options }}
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify that the real card was generated
        run: |
          test -s profile/streak.svg
          if grep -qi "Updating automatically" profile/streak.svg; then
            echo "The temporary placeholder was not replaced."
            exit 1
          fi
          grep -qi "Current Streak" profile/streak.svg

      - name: Commit the real streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/streak.svg

          if git diff --cached --quiet; then
            echo "Streak card is already current."
          else
            git commit -m "Refresh real GitHub streak card"
            git push
          fi
