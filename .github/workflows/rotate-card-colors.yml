name: Rotate Profile Colors

on:
  schedule:
    # Color rotation is local-only: it does not query the GitHub API.
    - cron: "17 */4 * * *"
      timezone: "Europe/Athens"
  workflow_dispatch:
    inputs:
      theme:
        description: "Choose a theme, or use auto for the next theme"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - tokyonight
          - radical
          - dracula
          - gruvbox
          - monokai
          - nord_dark
          - github_dark
          - solarized_dark

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Select one shared theme
        id: theme
        env:
          REQUESTED_THEME: ${{ github.event.inputs.theme || 'auto' }}
        run: python3 .github/scripts/rotate_card_theme.py set "$REQUESTED_THEME"

      - name: Re-render cached cards without GitHub API calls
        run: python3 .github/scripts/generate_profile_cards.py render

      - name: Recolor existing snake without regenerating contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_THEME: ${{ steps.theme.outputs.previous_theme }}
          TO_THEME: ${{ steps.theme.outputs.theme }}
        run: |
          set -euo pipefail
          rm -rf /tmp/profile-output

          if ! git clone --quiet --depth 1 --branch output \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/profile-output; then
            echo "Output branch is not available yet; snake recolor skipped."
            exit 0
          fi

          python3 .github/scripts/recolor_snake.py \
            --from-theme "$FROM_THEME" \
            --to-theme "$TO_THEME" \
            --directory /tmp/profile-output

          git -C /tmp/profile-output config user.name "github-actions[bot]"
          git -C /tmp/profile-output config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/profile-output add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          if git -C /tmp/profile-output diff --cached --quiet; then
            echo "Snake already uses the selected palette."
          else
            git -C /tmp/profile-output commit -m "Recolor contribution snake to $TO_THEME"
            git -C /tmp/profile-output push origin output
          fi

      - name: Verify synchronized local cards
        run: python3 .github/scripts/rotate_card_theme.py verify

      - name: Commit synchronized colors
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/profile-themes.json profile/stats.svg profile/streak.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Profile already uses ${{ steps.theme.outputs.theme }}."
          else
            git commit -m "Rotate cached profile colors to ${{ steps.theme.outputs.theme }}"

            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi

              echo "Main branch moved during color rotation; synchronizing before retry ${attempt}/3."
              git fetch origin "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
              git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            done

            echo "Unable to publish synchronized profile colors after 3 retries." >&2
            exit 1
          fi
