name: Rotate Profile Colors

on:
  schedule:
    - cron: "17 3,15 * * *"
      timezone: "Europe/Athens"
  workflow_dispatch:
    inputs:
      theme:
        description: "Choose a theme, or use auto for the next theme"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - tokyonight
          - radical
          - dracula
          - gruvbox
          - monokai
          - nord_dark
          - github_dark
          - solarized_dark

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Select one shared theme
        id: theme
        env:
          REQUESTED_THEME: ${{ github.event.inputs.theme || 'auto' }}
        run: python3 .github/scripts/rotate_card_theme.py set "$REQUESTED_THEME"

      - name: Prepare output directory
        run: mkdir -p profile

      - name: Generate matching real streak statistics
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: ${{ steps.theme.outputs.streak_options }}
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify that the real card was generated
        run: |
          test -s profile/streak.svg
          if grep -qi "Updating automatically" profile/streak.svg; then
            echo "The temporary placeholder was not replaced."
            exit 1
          fi
          grep -qi "Current Streak" profile/streak.svg

      - name: Generate matching snake animations
        uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ steps.theme.outputs.snake_outputs }}

      - name: Commit synchronized cards and theme state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/profile-themes.json profile/streak.svg

          if git diff --cached --quiet; then
            echo "Profile already uses ${{ steps.theme.outputs.theme }}."
          else
            git commit -m "Rotate profile colors to ${{ steps.theme.outputs.theme }}"
            git push
          fi

      - name: Publish matching snake to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "Update ${{ steps.theme.outputs.theme }} contribution snake"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
