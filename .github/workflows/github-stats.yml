name: GitHub Stats Cards

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure assets folder exists
        run: mkdir -p assets

      - name: Fetch cards safely (keep last successful on failure)
        shell: bash
        run: |
          set -euo pipefail

          tmp_stats="$(mktemp)"
          tmp_langs="$(mktemp)"

          stats_url="https://github-readme-stats.vercel.app/api?username=dedsec1121fk&show_icons=true&theme=transparent&border_color=9966ff&text_color=d0d8e0&title_color=9966ff&icon_color=e6d9ff"
          langs_url="https://github-readme-stats.vercel.app/api/top-langs/?username=dedsec1121fk&layout=compact&theme=transparent&border_color=9966ff&text_color=d0d8e0&title_color=9966ff&icon_color=e6d9ff"

          # Download to temp first so we never overwrite your last good SVGs on failure.
          if curl -fsSL "$stats_url" -o "$tmp_stats" && curl -fsSL "$langs_url" -o "$tmp_langs"; then
            # Sanity check: must look like SVG, not an HTML error page.
            if grep -qi "<svg" "$tmp_stats" && grep -qi "<svg" "$tmp_langs"; then
              mv "$tmp_stats" assets/github-stats.svg
              mv "$tmp_langs" assets/top-langs.svg
              echo "Cards updated."
            else
              echo "Invalid SVG detected. Keeping previous files."
              rm -f "$tmp_stats" "$tmp_langs"
              exit 0
            fi
          else
            echo "Fetch failed. Keeping previous files."
            rm -f "$tmp_stats" "$tmp_langs"
            exit 0
          fi

      - name: Commit if files exist and changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # First-run safety: only git-add if files exist.
          [ -f assets/github-stats.svg ] || exit 0
          [ -f assets/top-langs.svg ] || exit 0

          git add assets/github-stats.svg assets/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Stats cards update"
          git push
