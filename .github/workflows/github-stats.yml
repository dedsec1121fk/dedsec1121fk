name: GitHub Stats Cards

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure assets folder exists
        run: mkdir -p assets

      - name: Fetch cards safely (keep last successful on failure)
        shell: bash
        run: |
          set -euo pipefail

          fetch_svg() {
            out="$1"
            shift
            tmp="$(mktemp)"

            for url in "$@"; do
              echo "Trying: $url"
              code=$(curl -L -sS -o "$tmp" -w "%{http_code}" "$url" || true)
              echo "HTTP: $code"

              if [ "$code" = "200" ] && grep -qi "<svg" "$tmp"; then
                mv "$tmp" "$out"
                echo "Saved: $out"
                return 0
              fi
            done

            echo "All sources failed for $out (keeping previous)"
            rm -f "$tmp"
            return 0
          }

          mkdir -p assets

          fetch_svg "assets/github-stats.svg"             "https://github-readme-stats.vercel.app/api?username=dedsec1121fk&show_icons=true&theme=transparent&border_color=9966ff&text_color=d0d8e0&title_color=9966ff&icon_color=e6d9ff"             "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api?username=dedsec1121fk&show_icons=true&theme=transparent&border_color=9966ff&text_color=d0d8e0&title_color=9966ff&icon_color=e6d9ff"

          fetch_svg "assets/top-langs.svg"             "https://github-readme-stats.vercel.app/api/top-langs/?username=dedsec1121fk&layout=compact&theme=transparent&border_color=9966ff&text_color=d0d8e0&title_color=9966ff&icon_color=e6d9ff"             "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=dedsec1121fk&layout=compact&theme=transparent&border_color=9966ff&text_color=d0d8e0&title_color=9966ff&icon_color=e6d9ff"

      - name: Commit if files exist and changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -f assets/github-stats.svg ] || exit 0
          [ -f assets/top-langs.svg ] || exit 0

          git add assets/github-stats.svg assets/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Stats cards update"
          git push
