name: Generate Contribution Snake

on:
  schedule:
    # Refresh contribution data daily using Greece local time.
    - cron: "47 4 * * *"
      timezone: "Europe/Athens"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Load the current shared palette
        id: theme
        run: python3 .github/scripts/rotate_card_theme.py emit

      - name: Generate matching snake animations
        uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ steps.theme.outputs.snake_outputs }}

      - name: Publish animations to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "Refresh ${{ steps.theme.outputs.theme }} contribution snake"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
